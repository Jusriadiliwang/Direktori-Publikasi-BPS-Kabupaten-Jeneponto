<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chat BPS – Tanya Data Statistik Jeneponto</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d2137;--blue:#1a5fb4;--blue2:#2980d4;--accent:#f59e0b;
  --green:#10b981;--white:#fff;--gray50:#f8fafc;--gray100:#f1f5f9;
  --gray200:#e2e8f0;--gray400:#94a3b8;--gray500:#64748b;--gray600:#475569;
  --gray800:#1e293b;--text:#0f172a;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--gray50);color:var(--text)}
body{display:flex;flex-direction:column}

/* NAVBAR */
nav{background:var(--navy);flex-shrink:0;box-shadow:0 2px 16px rgba(0,0,0,.35);z-index:100}
.nav-inner{max-width:900px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;gap:12px}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo img{width:36px;height:36px;object-fit:contain;background:rgba(255,255,255,.12);border-radius:7px;padding:3px}
.nav-title{color:var(--white);font-size:.82rem;font-weight:700;line-height:1.3}
.nav-title small{font-size:.67rem;opacity:.6;font-weight:400;display:block}
.nav-sp{flex:1}
.nav-btn{color:rgba(255,255,255,.75);text-decoration:none;font-size:.81rem;font-weight:500;padding:6px 11px;border-radius:6px;transition:.2s;white-space:nowrap}
.nav-btn:hover{color:var(--white);background:rgba(255,255,255,.1)}
.nav-btn.active{background:rgba(255,255,255,.15);color:var(--white)}

/* CHAT CONTAINER */
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:0 auto;padding:0 16px;overflow:hidden}

/* WELCOME */
.welcome{padding:32px 0 16px;text-align:center;flex-shrink:0}
.welcome-logo{width:64px;height:64px;background:var(--navy);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.welcome-logo img{width:46px;height:46px;object-fit:contain}
.welcome h1{font-size:1.4rem;font-weight:800;color:var(--navy);margin-bottom:6px}
.welcome p{font-size:.88rem;color:var(--gray500);max-width:500px;margin:0 auto 20px}

/* QUICK QUESTIONS */
.quick-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.quick-btn{padding:7px 14px;background:var(--white);border:1.5px solid var(--gray200);border-radius:99px;font-size:.78rem;font-weight:600;color:var(--gray600);cursor:pointer;transition:.2s;white-space:nowrap}
.quick-btn:hover{border-color:var(--blue);color:var(--blue);background:#eff6ff}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:8px 0 16px;display:flex;flex-direction:column;gap:16px}
.messages:empty::after{content:'Mulai dengan mengetik pertanyaan di bawah';color:var(--gray400);font-size:.85rem;text-align:center;margin-top:20px}

/* Message bubbles */
.msg{display:flex;gap:10px;align-items:flex-start;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}

.msg-avatar{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem}
.msg.bot .msg-avatar{background:linear-gradient(135deg,var(--navy),var(--blue))}
.msg.bot .msg-avatar img{width:24px;height:24px;object-fit:contain}
.msg.user .msg-avatar{background:var(--blue);color:var(--white);font-size:.8rem;font-weight:700}

.msg-content{flex:1;max-width:85%}
.msg-bubble{padding:12px 16px;border-radius:14px;font-size:.88rem;line-height:1.6}
.msg.bot .msg-bubble{background:var(--white);border:1px solid var(--gray200);box-shadow:0 2px 8px rgba(0,0,0,.07);border-radius:4px 14px 14px 14px}
.msg.user .msg-bubble{background:var(--blue);color:var(--white);border-radius:14px 4px 14px 14px;margin-left:auto}
.msg-time{font-size:.68rem;color:var(--gray400);margin-top:4px;padding:0 4px}
.msg.user .msg-time{text-align:right}

/* Markdown-like formatting */
.msg-bubble strong,.msg-bubble b{font-weight:700;color:var(--blue)}
.msg.user .msg-bubble strong{color:rgba(255,255,255,.9)}
.msg-bubble br{display:block;content:'';margin:2px 0}

/* DATA CARD */
.data-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.data-card{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);border-radius:12px;padding:14px 16px;color:var(--white)}
.dc-label{font-size:.72rem;opacity:.75;margin-bottom:4px;line-height:1.3}
.dc-nilai{font-size:1.5rem;font-weight:800;line-height:1.1}
.dc-satuan{font-size:.73rem;opacity:.7;margin-bottom:6px}
.dc-tahun{font-size:.7rem;opacity:.55}
.dc-sumber{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15)}
.dc-sumber a{font-size:.7rem;color:rgba(255,255,255,.7);text-decoration:none;display:flex;align-items:center;gap:4px}
.dc-sumber a:hover{color:var(--white)}

/* TREND TABLE */
.trend-table{margin-top:12px;overflow-x:auto}
.trend-table table{width:100%;border-collapse:collapse;font-size:.8rem;background:var(--white);border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.trend-table th{background:var(--navy);color:rgba(255,255,255,.9);padding:8px 12px;font-weight:700}
.trend-table td{padding:7px 12px;border-bottom:1px solid var(--gray100)}
.trend-table tr:last-child td{border:none}
.trend-table tr:nth-child(even) td{background:var(--gray50)}
.trend-table td:last-child{font-weight:700;color:var(--blue);text-align:right}

/* TABEL MAKRO CARDS */
.makro-cards{margin-top:12px;display:grid;gap:8px}
.makro-card{background:var(--white);border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.07);border-left:4px solid var(--blue);overflow:hidden}
.makro-card.open{border-top:1px solid var(--gray100)}
.makro-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.makro-title{font-size:.85rem;font-weight:700;color:var(--navy)}
.makro-meta{font-size:.72rem;color:var(--gray500);margin-top:2px}
.makro-x{color:var(--gray400);font-size:.7rem;transition:.2s;flex-shrink:0}
.makro-card.open .makro-x{transform:rotate(180deg)}
.makro-body{display:none;padding:0 6px 10px}
.makro-card.open .makro-body{display:block}
.makro-table-wrap{overflow-x:auto;border:1px solid var(--gray100);border-radius:8px;margin:4px 8px}
.makro-table{border-collapse:collapse;font-size:.72rem;min-width:520px;width:100%}
.makro-table th{background:var(--navy);color:rgba(255,255,255,.9);padding:6px 8px;text-align:left;font-weight:600;white-space:nowrap;position:sticky;top:0}
.makro-table th.y{text-align:right;background:#122b4d}
.makro-table td{padding:5px 8px;border-bottom:1px solid var(--gray100);white-space:nowrap;color:var(--gray600)}
.makro-table td.y{text-align:right;font-variant-numeric:tabular-nums}
.makro-table td.lab{font-weight:600;color:var(--navy);max-width:180px;white-space:normal}
.makro-table td.empty{color:var(--gray300)}
.makro-table tr:nth-child(even){background:var(--gray50)}
.makro-table .sat{font-size:.66rem;color:var(--gray400);font-weight:400}
.makro-actions{display:flex;gap:8px;padding:8px}
.makro-btn{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;color:var(--blue);background:#eaf1fb;border:1px solid #d7e5f7;text-decoration:none;padding:6px 10px;border-radius:7px;transition:.2s}
.makro-btn:hover{background:#dbe9fb}
.makro-btn.export{color:var(--green);background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.25)}
.makro-btn.export:hover{background:rgba(16,185,129,.18)}

/* KECAMATAN TABLE */
.kec-table{margin-top:12px;overflow-x:auto}
.kec-table table{width:100%;border-collapse:collapse;font-size:.81rem;background:var(--white);border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.kec-table th{background:var(--navy);color:rgba(255,255,255,.9);padding:8px 12px;font-weight:700;text-align:left}
.kec-table td{padding:8px 12px;border-bottom:1px solid var(--gray100)}
.kec-table tr:last-child td{border:none}
.kec-table tr:hover td{background:#f0f7ff}
.kec-table td:nth-child(2){font-weight:700;color:var(--blue);text-align:right}
.kec-table td:nth-child(3),.kec-table td:nth-child(4){text-align:right;color:var(--gray500)}

/* PUBLIKASI CARDS */
.pub-cards{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pub-card{display:flex;gap:10px;background:var(--white);border:1px solid var(--gray200);border-radius:10px;padding:10px 12px;cursor:pointer;text-decoration:none;color:inherit;transition:.2s}
.pub-card:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,0,0,.1);transform:translateY(-1px)}
.pub-cover{width:44px;height:56px;object-fit:cover;border-radius:6px;background:var(--gray200);flex-shrink:0}
.pub-cover-ph{width:44px;height:56px;background:linear-gradient(135deg,var(--navy),var(--blue));border-radius:6px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:1.3rem;flex-shrink:0}
.pub-info{flex:1;min-width:0}
.pub-title{font-size:.84rem;font-weight:700;color:var(--navy);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pub-meta{font-size:.73rem;color:var(--gray400);margin-top:3px}
.pub-badge{font-size:.67rem;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(26,95,180,.1);color:var(--blue);margin-top:4px;display:inline-block}

/* SARAN */
.saran-wrap{margin-top:12px}
.saran-title{font-size:.73rem;color:var(--gray400);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.saran-list{display:flex;flex-wrap:wrap;gap:6px}
.saran-btn{padding:5px 12px;background:var(--gray100);border:1px solid var(--gray200);border-radius:99px;font-size:.77rem;color:var(--gray600);cursor:pointer;transition:.2s}
.saran-btn:hover{background:var(--blue);color:var(--white);border-color:var(--blue)}

/* TYPING INDICATOR */
.typing{display:flex;gap:4px;padding:12px 16px;background:var(--white);border:1px solid var(--gray200);border-radius:4px 14px 14px 14px;width:fit-content}
.typing span{width:7px;height:7px;background:var(--gray400);border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Scrollbar */
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--gray200);border-radius:99px}
.input-bar{flex-shrink:0;padding:12px 0 20px;background:var(--gray50);border-top:1px solid var(--gray200)}
.input-inner{display:flex;gap:8px;align-items:flex-end}
.input-wrap{flex:1;position:relative}
textarea#chatInput{
  width:100%;padding:12px 16px;padding-right:44px;
  border:2px solid var(--gray200);border-radius:14px;
  font-size:.9rem;font-family:inherit;line-height:1.5;
  resize:none;outline:none;background:var(--white);
  max-height:120px;overflow-y:auto;transition:.3s;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
textarea#chatInput:focus{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,0,0,.06),0 0 0 3px rgba(26,95,180,.1)}
textarea#chatInput::placeholder{color:var(--gray400)}
.btn-send{width:44px;height:44px;background:var(--blue);border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.btn-send:hover{background:var(--navy)}
.btn-send:disabled{background:var(--gray200);cursor:not-allowed}
.btn-send svg{color:var(--white)}
.input-hint{font-size:.72rem;color:var(--gray400);margin-top:6px;text-align:center}

/* PDF RESULTS */
.pdf-results{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pdf-card{background:var(--white);border:1px solid var(--gray200);border-radius:10px;overflow:hidden;transition:.2s}
.pdf-card:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.pdf-header{display:flex;gap:10px;padding:10px 12px;align-items:flex-start}
.pdf-cover{width:40px;height:50px;object-fit:cover;border-radius:5px;flex-shrink:0}
.pdf-cover-ph{width:40px;height:50px;background:linear-gradient(135deg,#1a5fb4,#2980d4);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.pdf-info{flex:1;min-width:0}
.pdf-title{font-size:.83rem;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:2px}
.pdf-year{font-size:.71rem;color:var(--gray400);margin-bottom:4px}
.pdf-snippet{font-size:.79rem;color:var(--gray600);line-height:1.55;font-style:italic;background:var(--gray50);border-left:3px solid var(--blue);padding:7px 10px;margin:0 12px 8px;border-radius:0 6px 6px 0}
.pdf-actions{display:flex;gap:6px;padding:0 12px 10px}
.pdf-btn{padding:5px 12px;border-radius:7px;font-size:.75rem;font-weight:600;cursor:pointer;text-decoration:none;border:1.5px solid;transition:.2s;display:inline-flex;align-items:center;gap:4px}
.pdf-btn.primary{background:var(--blue);color:var(--white);border-color:var(--blue)}
.pdf-btn.primary:hover{background:var(--navy);border-color:var(--navy)}
.pdf-btn.secondary{background:transparent;color:var(--blue);border-color:var(--blue)}
.pdf-btn.secondary:hover{background:#eff6ff}

/* Scrollbar */
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--gray200);border-radius:99px}</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="/">
      <img src="/assets/logo-bps.png" alt="BPS"/>
      <div class="nav-title">BPS Kabupaten Jeneponto<small>Asisten Data Statistik</small></div>
    </a>
    <div class="nav-sp"></div>
    <a class="nav-btn" href="/">Publikasi</a>
    <a class="nav-btn" href="/indikator.html">Indikator</a>
    <a class="nav-btn" href="/tabel.html">Tabel</a>
    <a class="nav-btn active" href="/chat.html">Chat</a>
  </div>
</nav>

<!-- CHAT AREA -->
<div class="chat-wrap">

  <!-- Welcome -->
  <div class="welcome" id="welcomeSection">
    <div class="welcome-logo">
      <img src="/assets/logo-bps.png" alt="BPS"/>
    </div>
    <h1>Tanya Data BPS Jeneponto</h1>
    <p>Ajukan pertanyaan dalam bahasa Indonesia. Saya akan menjawab dengan data statistik resmi BPS Kabupaten Jeneponto.</p>

    <!-- Quick questions -->
    <div class="quick-wrap" id="quickWrap">
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Berapa jumlah penduduk Jeneponto?</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Berapa IPM 2025?</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Berapa tingkat kemiskinan?</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Luas lahan sawah Jeneponto</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Berapa PDRB Jeneponto?</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Tampilkan Dalam Angka 2026</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Data penduduk per kecamatan</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Berapa laju pertumbuhan ekonomi?</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Data pertanian Jeneponto</button>
      <button class="quick-btn" onclick="kirimCepat(this.textContent)">Berapa aset daerah Jeneponto?</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-inner">
      <div class="input-wrap">
        <textarea id="chatInput" rows="1" placeholder="Tanya sesuatu... contoh: Berapa jumlah penduduk Jeneponto?"></textarea>
      </div>
      <button class="btn-send" id="btnSend" onclick="kirim()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <p class="input-hint">Tekan Enter untuk kirim · Shift+Enter untuk baris baru</p>
  </div>

</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('chatInput');
let isLoading = false;

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Enter to send
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    kirim();
  }
});

// ── Kirim cepat ───────────────────────────────────────
function kirimCepat(teks) {
  inputEl.value = teks;
  kirim();
}

// ── Kirim pesan ───────────────────────────────────────
async function kirim() {
  const teks = inputEl.value.trim();
  if (!teks || isLoading) return;

  // Sembunyikan welcome setelah pesan pertama
  const welcome = document.getElementById('welcomeSection');
  if (welcome) { welcome.style.display = 'none'; }

  // Tampilkan pesan user
  tambahPesan('user', teks);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Tampilkan typing indicator
  const typingId = tambahTyping();
  isLoading = true;
  document.getElementById('btnSend').disabled = true;

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pesan: teks }),
    });
    const data = await r.json();
    hapusPesan(typingId);
    if (data.ok) {
      tambahResponBot(data);
    } else {
      tambahPesan('bot', 'Maaf, terjadi kesalahan. Silakan coba lagi.');
    }
  } catch (e) {
    hapusPesan(typingId);
    tambahPesan('bot', 'Tidak dapat terhubung ke server. Pastikan server berjalan.');
  } finally {
    isLoading = false;
    document.getElementById('btnSend').disabled = false;
    inputEl.focus();
  }
}

// ── Tambah pesan ──────────────────────────────────────
function tambahPesan(siapa, teks) {
  const id  = 'msg_' + Date.now();
  const div = document.createElement('div');
  div.className = `msg ${siapa}`;
  div.id = id;

  const waktu = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });

  if (siapa === 'user') {
    div.innerHTML = `
      <div class="msg-avatar">${getInitial()}</div>
      <div class="msg-content">
        <div class="msg-bubble">${esc(teks)}</div>
        <div class="msg-time">${waktu}</div>
      </div>`;
  } else {
    div.innerHTML = `
      <div class="msg-avatar"><img src="/assets/logo-bps.png" alt="BPS"/></div>
      <div class="msg-content">
        <div class="msg-bubble">${formatTeks(teks)}</div>
        <div class="msg-time">${waktu}</div>
      </div>`;
  }
  messagesEl.appendChild(div);
  scrollBottom();
  return id;
}

// ── Tambah respons bot lengkap ─────────────────────────
function tambahResponBot(data) {
  const id  = 'msg_' + Date.now();
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = id;

  const waktu = new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });

  let html = `
    <div class="msg-avatar"><img src="/assets/logo-bps.png" alt="BPS"/></div>
    <div class="msg-content">
      <div class="msg-bubble">${formatTeks(data.jawaban)}</div>`;

  // ── Data kartu statistik ──
  if (data.dataKartu && data.dataKartu.length) {
    html += `<div class="data-cards">`;
    data.dataKartu.forEach(d => {
      const src = d.sumber || null;
      const lokal = src && src.fileLokal
        ? `<a href="${esc(src.fileLokal)}" target="_blank" rel="noopener" style="color:#4ade80!important">
             <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
             Buka PDF (Lokal) — ${esc((src.judul||'').substring(0,32))}…</a>`
        : '';
      const luar = src && src.url && src.url !== src.fileLokal
        ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">
             <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
             ${esc((src.judul||'').substring(0,38))}…</a>`
        : '';
      const sumberLink = (lokal || luar)
        ? `<div class="dc-sumber" style="display:flex;flex-wrap:wrap;gap:6px 12px">${lokal}${luar}</div>`
        : '';
      html += `
        <div class="data-card">
          <div class="dc-label">${esc(d.nama)}</div>
          <div class="dc-nilai">${esc(d.nilai)}</div>
          <div class="dc-satuan">${esc(d.satuan)}</div>
          <div class="dc-tahun">Tahun ${esc(d.tahun)}</div>
          ${sumberLink}
        </div>`;
    });
    html += `</div>`;
  }

  // ── Trend data ──
  if (data.trendData && data.trendData.length) {
    html += `<div class="trend-table"><table>
      <thead><tr><th>Tahun</th><th style="text-align:right">Nilai</th></tr></thead>
      <tbody>`;
    data.trendData.forEach(t => {
      html += `<tr><td>${esc(t.tahun)}</td><td style="text-align:right;font-weight:700;color:#1a5fb4">${esc(t.nilai)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  // ── Tabel Statistik Makro ──
  if (data.tabelMakro && data.tabelMakro.length) {
    html += `<div class="makro-cards">`;
    data.tabelMakro.forEach(t => {
      const years = t.years || [];
      const yearHdr = years.map(y => `<th class="y">${esc(y)}</th>`).join('');
      const rowsHtml = (t.rows||[]).map(r => {
        const sat = r.satuan ? ` <span class="sat">(${esc(r.satuan)})</span>` : '';
        const cells = r.nilai.map(v => {
          const val = (v ?? '').toString().trim();
          if (!val) return '<td class="y empty">–</td>';
          return /^\d+$/.test(val) ? `<td class="y">${esc(Number(val).toLocaleString('id-ID'))}</td>` : `<td class="y">${esc(val)}</td>`;
        }).join('');
        return `<tr><td class="lab">${esc(r.label)}${sat}</td>${cells}</tr>`;
      }).join('');
      html += `
        <div class="makro-card">
          <div class="makro-head" onclick="this.parentElement.classList.toggle('open')">
            <div>
              <div class="makro-title">${esc(t.nama)}</div>
              <div class="makro-meta">${t.jml} indikator · ${esc(years[0]||'')}–${esc(years[years.length-1]||'')}</div>
            </div>
            <span class="makro-x">\u25BC</span>
          </div>
          <div class="makro-body">
            <div class="makro-table-wrap">
              <table class="makro-table"><thead><tr><th>${t.perKecamatan?'Kecamatan':'Indikator'}</th>${yearHdr}</tr></thead><tbody>${rowsHtml}</tbody></table>
            </div>
            <div class="makro-actions">
              <a href="/tabel.html#${esc(t.nama.toLowerCase().replace(/[^a-z0-9]+/g,'-'))}" target="_blank" rel="noopener" class="makro-btn">Lihat di Tabel Dinamis</a>
              <a href="/api/tabel-makro/${encodeURIComponent(t.nama)}/export" class="makro-btn export">Ekspor Excel</a>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }

  // ── Data kecamatan ──
  if (data.kecamatan && data.kecamatan.length) {
    html += `<div class="kec-table"><table>
      <thead><tr>
        <th>Kecamatan</th>
        <th style="text-align:right">Penduduk</th>
        <th style="text-align:right">Laki-laki</th>
        <th style="text-align:right">Perempuan</th>
      </tr></thead>
      <tbody>`;
    data.kecamatan.forEach(k => {
      html += `<tr>
        <td style="font-weight:600">${esc(k.kecamatan)}</td>
        <td style="text-align:right;font-weight:700;color:#1a5fb4">${k.penduduk.toLocaleString('id')}</td>
        <td style="text-align:right;color:#64748b">${k.laki.toLocaleString('id')}</td>
        <td style="text-align:right;color:#64748b">${k.perempuan.toLocaleString('id')}</td>
      </tr>`;
    });
    html += `</tbody></table>
      <p style="font-size:.7rem;color:#94a3b8;padding:6px 4px">Sumber: BPS Kabupaten Jeneponto, 2026</p>
    </div>`;
  }

  // ── Publikasi cards ──
  if (data.publikasi && data.publikasi.length) {
    html += `<div class="pub-cards">`;
    data.publikasi.forEach(p => {
      const cUrl = cvr(p.cover);
      const cover = cUrl
        ? `<img class="pub-cover" src="${esc(cUrl)}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
        : '';
      const ph = `<div class="pub-cover-ph" ${cUrl ? 'style="display:none"' : ''}>&#128196;</div>`;
      const href = p.fileLokal ? p.fileLokal : (p.url || '#');
      const target = p.fileLokal ? '_blank' : '_blank';
      html += `
        <a class="pub-card" href="${esc(href)}" target="${target}" rel="noopener">
          ${cover}${ph}
          <div class="pub-info">
            <div class="pub-title">${esc(p.judul)}</div>
            <div class="pub-meta">${esc(p.tanggal || '')}${p.kategori ? ' &middot; ' : ''}<span class="pub-badge">${esc(p.kategori || '')}</span></div>
            ${p.fileLokal ? '<span style="font-size:.7rem;color:#10b981;font-weight:700">&#10003; PDF Tersedia</span>' : ''}
          </div>
        </a>`;
    });
    html += `</div>`;
  }

  // ── PDF Hasil pencarian ──
  if (data.pdfHasil && data.pdfHasil.length) {
    const label = data.publikasi && data.publikasi.length ? 'Kutipan dari publikasi:' : 'Ditemukan di dalam publikasi:';
    html += `<div class="pdf-results"><div style="font-size:.73rem;color:var(--gray400);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px">${label}</div>`;
    data.pdfHasil.forEach(p => {
      const cUrl = cvr(p.cover);
      const cover = cUrl
        ? `<img class="pdf-cover" src="${esc(cUrl)}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
        : '';
      const ph = `<div class="pdf-cover-ph" ${cUrl ? 'style="display:none"' : ''}>&#128196;</div>`;
      html += `<div class="pdf-card">
        <div class="pdf-header">
          ${cover}${ph}
          <div class="pdf-info">
            <div class="pdf-title">${esc(p.judul)}</div>
            <div class="pdf-year">Tahun ${esc(String(p.tahun || '-'))}</div>
          </div>
        </div>
        ${p.snippet ? `<div class="pdf-snippet">&ldquo;...${esc(p.snippet)}...&rdquo;</div>` : ''}
        <div class="pdf-actions">
          ${p.fileLokal ? `<a class="pdf-btn primary" href="${esc(p.fileLokal)}" target="_blank">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Baca PDF</a>` : ''}
          ${p.url_bps ? `<a class="pdf-btn secondary" href="${esc(p.url_bps)}" target="_blank" rel="noopener">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Lihat di BPS</a>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // ── Saran pertanyaan ──
  if (data.saranKueri && data.saranKueri.length) {
    html += `<div class="saran-wrap">
      <div class="saran-title">Tanyakan juga:</div>
      <div class="saran-list">`;
    data.saranKueri.forEach(s => {
      html += `<button class="saran-btn" onclick="kirimCepat('${esc(s)}')">${esc(s)}</button>`;
    });
    html += `</div></div>`;
  }

  html += `<div class="msg-time">${waktu}</div></div>`;

  div.innerHTML = html;
  messagesEl.appendChild(div);
  scrollBottom();
}

// ── Typing indicator ──────────────────────────────────
function tambahTyping() {
  const id  = 'typing_' + Date.now();
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = id;
  div.innerHTML = `
    <div class="msg-avatar"><img src="/assets/logo-bps.png" alt="BPS"/></div>
    <div class="msg-content">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  messagesEl.appendChild(div);
  scrollBottom();
  return id;
}

function hapusPesan(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ── Helpers ───────────────────────────────────────────
function scrollBottom() {
  setTimeout(() => messagesEl.scrollTop = messagesEl.scrollHeight, 50);
}

function getInitial() {
  return (localStorage.getItem('bps_nama')||'U').charAt(0).toUpperCase();
}

function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Cover BPS lewat proxy lokal (hindari blok CORP browser)
function cvr(u){
  if (!u) return '';
  if (u.startsWith('/')) return u;
  if (u.includes('_next/image')) {
    const m = u.match(/[?&]url=([^&]+)/);
    if (m) return '/api/cover?url=' + encodeURIComponent(decodeURIComponent(m[1]));
  }
  return '/api/cover?url=' + encodeURIComponent(u);
}

function formatTeks(s) {
  return String(s??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}
</script>
