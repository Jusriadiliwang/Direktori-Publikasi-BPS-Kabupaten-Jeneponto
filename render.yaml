services:
  - type: web
    name: bps-jeneponto-publikasi
    runtime: node
    plan: free
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /data
      # API key gratis dari https://webapi.bps.go.id — untuk tautan PDF langsung di chat
      - key: BPS_API_KEY
        sync: false
    disk:
      name: bps-data
      mountPath: /data
      sizeGB: 1
